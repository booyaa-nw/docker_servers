services:
  influxdb:
    image: influxdb:2
    container_name: nw-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb2:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ChangeMeStrongPassword
      DOCKER_INFLUXDB_INIT_ORG: nwlab
      DOCKER_INFLUXDB_INIT_BUCKET: nw_events
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ChangeMeLongRandomToken

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: nw-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - nw-grafana-volume:/var/lib/grafana
    depends_on:
      - influxdb

  telegraf:
    image: telegraf:latest
    container_name: nw-telegraf
    restart: unless-stopped
    ports:
      - "514:514/udp"
      - "514:514/tcp"
      - "162:162/udp"
      - "162:162/tcp"
    volumes:
      - ./config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./logs:/var/log/nw-telegraf
      - ./mibs:/usr/share/snmp/mibs:ro
    depends_on:
      - influxdb
    cap_add:
      - NET_BIND_SERVICE

  mailpit:
    image: axllent/mailpit
    container_name: nw-mailpit
    ports:
      - "25:1025"   # SMTPサーバー用ポート
      - "8025:8025" # Web UI用ポート
    environment:
      - TZ=Asia/Tokyo
    restart: always

  coredns:
    image: coredns/coredns:1.11.3 # 2026年時点の安定版
    container_name: nw-coredns
    restart: always
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile
      - ./coredns/zones/db.nvc.lab:/etc/coredns/db.nvc.lab
      - ./coredns/zones/db.172.16.60:/etc/coredns/db.172.16.60
    command: ["-conf", "/etc/coredns/Corefile"]

  # ディレクトリ（ユーザー: inetOrgPerson+posixAccount / グループ: posixGroup / Dynamic VLAN用スキーマ）
  openldap:
    build: ./openldap
    image: nwlab/openldap:local
    container_name: nw-openldap
    restart: unless-stopped
    ports:
      - "389:389/tcp"
    environment:
      TZ: Asia/Tokyo
      # 以下は初回起動時（ldap-shared/settings.json がないとき）だけ使われます
      LDAP_BASE_DN: "dc=nvc,dc=lab"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}"
      LDAP_RADIUS_PASSWORD: "${LDAP_RADIUS_PASSWORD:?Set LDAP_RADIUS_PASSWORD in .env}"
      LDAP_USER1_PASSWORD: "${LDAP_USER1_PASSWORD:?Set LDAP_USER1_PASSWORD in .env}"
      LDAP_USER2_PASSWORD: "${LDAP_USER2_PASSWORD:?Set LDAP_USER2_PASSWORD in .env}"
    volumes:
      - ./openldap/slapd.conf.tmpl:/templates/slapd.conf.tmpl:ro
      - ./openldap/bootstrap.ldif.tmpl:/templates/bootstrap.ldif.tmpl:ro
      - ./openldap/data:/var/lib/openldap/openldap-data
      - ./ldap-shared:/shared

  # RADIUS（LDAP参照 / PAP・MS-CHAPv2・PEAP / Dynamic VLAN）
  freeradius:
    build: ./freeradius
    image: nwlab/freeradius:local
    container_name: nw-freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      TZ: Asia/Tokyo
      RADIUS_SECRET: "${RADIUS_SECRET:?Set RADIUS_SECRET in .env}"
      RADIUS_DEBUG: "${RADIUS_DEBUG:-0}"     # 1 にすると freeradius -X
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius/ldap.tmpl:/templates/ldap.tmpl:ro
      - ./ldap-shared:/shared
    depends_on:
      - openldap

  # LDAPユーザ管理 Web UI（http://<ホスト>:8080/）
  ldapadmin:
    build: ./ldapadmin
    image: nwlab/ldapadmin:local
    container_name: nw-ldapadmin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Tokyo
      LDAP_URI: ldap://nw-openldap:389
    volumes:
      - ./ldap-shared:/shared
    depends_on:
      - openldap

volumes:
  nw-grafana-volume:
