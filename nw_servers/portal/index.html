<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14314a">
  <title>NW Lab Portal</title>
  <style>
    :root{font-family:system-ui,"Meiryo UI",sans-serif;color:#172534;background:#f2f5f8;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#14314a;color:#fff;padding:22px max(22px,calc((100vw - 1120px)/2))}header .eyebrow{font-size:12px;letter-spacing:.12em;color:#a9c3d4}h1{font-size:26px;margin:4px 0}header p{margin:4px 0;color:#d3e0e8}main{max-width:1120px;margin:0 auto;padding:30px 22px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2{margin:0;font-size:18px}.section-title p{margin:0;color:#687888;font-size:13px}.plugins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.plugin{display:flex;flex-direction:column;min-height:210px;padding:22px;background:#fff;border:1px solid #d8e1e9;border-radius:12px;text-decoration:none;color:inherit;box-shadow:0 4px 15px #17344d0a;transition:transform .15s,border-color .15s}.plugin:hover{transform:translateY(-2px);border-color:#4a7fa2}.icon{display:grid;place-items:center;width:44px;height:44px;background:#e9f1f6;border-radius:10px;color:#194b6c;font-size:21px}.plugin h3{margin:16px 0 4px;font-size:18px}.plugin p{margin:0;color:#647484;line-height:1.6}.open{margin-top:auto;padding-top:18px;color:#17618d;font-weight:650}.foot{margin-top:28px;color:#8492a0;font-size:12px}@media(max-width:680px){.plugins{grid-template-columns:1fr}header{padding:18px 20px}main{padding:22px 16px}}
  </style>
</head>
<body>
  <header><div class="eyebrow">NETWORK TEST ENVIRONMENT</div><h1>NW Lab Portal</h1><p>ネットワーク検証ツール</p></header>
  <main>
    <div class="section-title"><h2>ツール</h2><p>利用する管理・監視ツールを選択してください</p></div>
    <section class="plugins" aria-label="ツール一覧">
      <a class="plugin" href="/ldap/">
        <span class="icon" aria-hidden="true">LDAP</span><h3>LdapMgtTooz</h3>
        <p>LDAPユーザー、グループ、Dynamic VLAN、ドメインを管理します。</p><span class="open">開く →</span>
      </a>
      <a class="plugin" href="/log-view/">
        <span class="icon" aria-hidden="true">LOG</span><h3>NW Log View</h3>
        <p>Syslog、SNMP Trap、Mailpitの受信イベントを検索・確認します。</p><span class="open">開く →</span>
      </a>
    </section>
    <p class="foot">NW Lab · Raspberry Pi / Docker Compose</p>
  </main>
</body>
</html>
