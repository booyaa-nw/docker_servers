listen=YES
listen_ipv6=NO
listen_port=2121
background=NO

anonymous_enable=YES
no_anon_password=YES
local_enable=NO
write_enable=NO
anon_root=/srv/public
anon_world_readable_only=YES
hide_ids=YES

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_addr_resolve=YES
pasv_address=@FTP_PASV_ADDRESS@

xferlog_enable=YES
log_ftp_protocol=NO
