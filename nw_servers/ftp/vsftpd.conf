listen=YES
listen_ipv6=NO
listen_port=21
background=NO

anonymous_enable=NO
local_enable=YES
check_shell=NO
pam_service_name=vsftpd
local_root=/srv/public
chroot_local_user=YES
allow_writeable_chroot=YES
write_enable=YES
local_umask=0002
file_open_mode=0666
hide_ids=YES

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

xferlog_enable=YES
log_ftp_protocol=NO
