# RADIUSクライアント（NAS: FortiGate / FortiAP / スイッチ 等）
# 共有シークレットは .env の RADIUS_SECRET を参照

client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SECRET}
}

# ラボ用: プライベートアドレス全体を許可。必要に応じて機器単位に絞ってください
client lab-172 {
	ipaddr = 172.16.0.0/12
	secret = $ENV{RADIUS_SECRET}
}

client lab-192 {
	ipaddr = 192.168.0.0/16
	secret = $ENV{RADIUS_SECRET}
}

client lab-10 {
	ipaddr = 10.0.0.0/8
	secret = $ENV{RADIUS_SECRET}
}
