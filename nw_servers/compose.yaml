services:
  # ディレクトリ（ユーザー: inetOrgPerson+posixAccount / グループ: posixGroup / Dynamic VLAN用スキーマ）
  openldap:
    build: ./openldap
    image: nwlab/openldap:local
    container_name: nw-openldap
    restart: unless-stopped
    ports:
      - "389:389/tcp"
    environment:
      TZ: Asia/Tokyo
      # 初回起動時（shared/ldap/settings.json がないとき）だけ使われます
      LDAP_BASE_DN: "dc=asakusa,dc=lab"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}"
      LDAP_RADIUS_PASSWORD: "${LDAP_RADIUS_PASSWORD:?Set LDAP_RADIUS_PASSWORD in .env}"
      LDAP_USER1_PASSWORD: "${LDAP_USER1_PASSWORD:?Set LDAP_USER1_PASSWORD in .env}"
      LDAP_USER2_PASSWORD: "${LDAP_USER2_PASSWORD:?Set LDAP_USER2_PASSWORD in .env}"
    volumes:
      - ./openldap/config/slapd.conf.tmpl:/templates/slapd.conf.tmpl:ro
      - ./openldap/config/bootstrap.ldif.tmpl:/templates/bootstrap.ldif.tmpl:ro
      - ./openldap/data:/var/lib/openldap/openldap-data
      - ./shared/ldap:/shared

  # RADIUS（LDAP参照 / PAP・MS-CHAPv2・PEAP / Dynamic VLAN）
  freeradius:
    build: ./freeradius
    image: nwlab/freeradius:local
    container_name: nw-freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      TZ: Asia/Tokyo
      RADIUS_SECRET: "${RADIUS_SECRET:?Set RADIUS_SECRET in .env}"
      RADIUS_DEBUG: "${RADIUS_DEBUG:-0}"     # 1 にすると freeradius -X
    volumes:
      - ./freeradius/config/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius/config/ldap.tmpl:/templates/ldap.tmpl:ro
      - ./shared/ldap:/shared
    depends_on:
      - openldap

  # LDAPユーザ管理 Web UI（Caddy経由: /ldap/）
  ldapmgttooz:
    build: ./ldapmgttooz
    image: nwlab/ldapmgttooz:local
    container_name: nw-ldapmgttooz
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: Asia/Tokyo
      LDAP_URI: ldap://nw-openldap:389
      APP_BASE_PATH: /ldap
      APP_COOKIE_SECURE: "false"
      NETRIG_SHARED_SECRET: "${NETRIG_SECRET:?Set NETRIG_SECRET in .env}"
    volumes:
      - ./shared/ldap:/shared
      - ./ldapmgttooz/config:/config:ro
      - ./ldapmgttooz/data:/data
    depends_on:
      - openldap

  mailpit-certs:
    build: ./mailpit-certs
    image: nwlab/mailpit-certs:local
    container_name: nw-mailpit-certs
    environment:
      TLS_CERT_CN: "${PUBLIC_DOMAIN:-nwlab.local}"
      TLS_CERT_SAN: "DNS:${PUBLIC_DOMAIN:-nwlab.local},IP:${PI_IP:-127.0.0.1}"
    volumes:
      - ./mailpit/secrets:/certs
    restart: "no"

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.1
    container_name: nw-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025/tcp"
    expose:
      - "8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_SMTP_TLS_CERT: /certs/tls.crt
      MP_SMTP_TLS_KEY: /certs/tls.key
      MP_ALLOWED_HOSTS: mailpit:8025,localhost:8025
      TZ: Asia/Tokyo
    volumes:
      - ./mailpit/data:/data
      - ./mailpit/secrets:/certs:ro
      - ./mailpit/config:/etc/mailpit:ro
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mailpit-certs:
        condition: service_completed_successfully

  mailpit-smtps:
    build: ./mailpit-smtps
    image: nwlab/mailpit-smtps:local
    container_name: nw-mailpit-smtps
    restart: unless-stopped
    ports:
      - "465:1465/tcp"
    environment:
      SMTP_TLS_CERT: /certs/tls.crt
      SMTP_TLS_KEY: /certs/tls.key
      SMTP_BACKEND: mailpit:1025
    volumes:
      - ./mailpit/secrets:/certs:ro
    depends_on:
      mailpit-certs:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  log-view:
    build: ./plugins/log_view
    image: nwlab/netrig-log-view:local
    container_name: nw-log-view
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "514:1514/udp"
      - "514:1514/tcp"
      - "162:1162/udp"
      - "162:1162/tcp"
    environment:
      TZ: Asia/Tokyo
      APP_BASE_PATH: /log-view
      NETRIG_SHARED_SECRET: "${NETRIG_SECRET:?Set NETRIG_SECRET in .env}"
      LOG_VIEW_DB: /data/logs.sqlite3
      LOG_VIEW_MIB_DIR: /config/mibs
      LOG_VIEW_MIB_CACHE: /data/mibs-compiled
      MAILPIT_API_URL: http://mailpit:8025
      MAILPIT_USERNAME: "${MAILPIT_USERNAME:-}"
      MAILPIT_PASSWORD: "${MAILPIT_PASSWORD:-}"
      MAILPIT_POLL_SECONDS: "${MAILPIT_POLL_SECONDS:-2}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
    volumes:
      - ./plugins/log_view/data:/data
      - ./plugins/log_view/config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 2.0
    depends_on:
      mailpit:
        condition: service_healthy

  netrig:
    build: ./netrig
    image: nwlab/netrig:local
    container_name: nw-netrig
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: Asia/Tokyo
      NETRIG_ADMIN_PASSWORD: "${NETRIG_ADMIN_PASSWORD:?Set NETRIG_ADMIN_PASSWORD in .env}"
      NETRIG_SECRET: "${NETRIG_SECRET:?Set NETRIG_SECRET in .env}"
    volumes:
      - ./netrig/config:/config:ro
      - ./netrig/data:/data

  caddy:
    image: caddy:2-alpine
    container_name: nw-caddy
    restart: unless-stopped
    ports:
      - "80:80/tcp"
    volumes:
      - ./caddy/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/data/config:/config
    depends_on:
      - netrig
      - ldapmgttooz
      - log-view

